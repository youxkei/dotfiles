#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "youxkei"
email = "youxkei@gmail.com"

# The key git/config signs with, through 1Password's op-ssh-sign, whose path differs per platform below.
[signing]
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFB++QTgmLSv6XpWqh2iQ1ub3lzVeFJo/GJucxy5HZjb"
behavior = "own"

# Shared with git, so that a signature reads as good to both.
[signing.backends.ssh]
allowed-signers = "~/.config/git/allowed_signers"

# Linux here is WSL, signing through the Windows 1Password.
[[--scope]]
--when.platforms = ["linux"]
[--scope.signing.backends.ssh]
program = "/mnt/c/Program Files/1Password/app/8/op-ssh-sign-wsl"

[[--scope]]
--when.platforms = ["macos"]
[--scope.signing.backends.ssh]
program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"

[aliases]
# `util exec` is what lets an alias reach a script at all: jj has no equivalent of
# Git's external subcommands, so a `jj-push` on PATH is not found by `jj push` on
# its own.
push = ["util", "exec", "--", "jj-push"]
# Not `new`: jj refuses an alias that overrides a built-in command.
open = ["util", "exec", "--", "jj-open"]

# Windows runs no script by its shebang, so there the same scripts go through Git Bash, named by its path
# because the `bash` on the Windows PATH is WSL's.
[[--scope]]
--when.platforms = ["windows"]
[--scope.aliases]
push = ["util", "exec", "--", 'C:\Program Files\Git\bin\bash.exe', "-c", 'exec "$HOME/repo/dotfiles/bin/jj-push" "$@"', "jj-push"]
open = ["util", "exec", "--", 'C:\Program Files\Git\bin\bash.exe', "-c", 'exec "$HOME/repo/dotfiles/bin/jj-open" "$@"', "jj-open"]
[--scope.signing.backends.ssh]
program = 'C:\Program Files\1Password\app\8\op-ssh-sign.exe'

[revset-aliases]
# builtin_immutable_heads() without its `present(trunk())` term. Under the builtin,
# pushing a bookmark that trunk() resolves to freezes the commit it lands on, and jj
# answers a working copy turning immutable by moving @ onto a fresh empty commit —
# pushing a change is then also the act of leaving it, and the amend after the
# push is refused. Tags and untracked remote bookmarks are somebody else's history
# and stay immutable.
"immutable_heads()" = "tags() | untracked_remote_bookmarks()"
